name: Nightly

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_SYNC: "1"

jobs:
  brick-tests:
    name: Brick tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux® ARM64, Clang
            os: ubuntu-24.04-arm
            cc: clang-18
            cxx: clang++-18
            parallel: 4
            build_dir: build
            from_source: "OFF"
          - name: macOS® ARM64, AppleClang
            os: macos-15
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            parallel: 3
            build_dir: build_native
            from_source: "ON"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.parallel }}
      COMPUTE_FLOW_CI_BUILD_DIR: ${{ matrix.build_dir }}
      COMPUTE_FLOW_HOME: ${{ github.workspace }}/.compute-flow
      COMPUTE_FLOW_TEST_MODEL_HOME: /tmp/cf-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install Linux® system dependencies
        if: runner.os == 'Linux' # trademark-check: allow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 lld-18 ninja-build pkg-config python3-dev \
            libsndfile1
      - name: Install macOS® system dependencies
        if: runner.os == 'macOS' # trademark-check: allow
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ninja pkg-config
      - name: Install Python dependencies
        run: uv sync --locked --no-default-groups --group build --group bricks --group tests
      - name: Install bricks
        run: |
          uv run compute-flow update
          uv run compute-flow brick install --all
          uv run compute-flow brick list
          ln -s "$COMPUTE_FLOW_HOME" "$COMPUTE_FLOW_TEST_MODEL_HOME"
      - name: Build from source with Brick Manager
        if: matrix.from_source == 'ON'
        run: uv run compute-flow build native --from-source --jobs "$CMAKE_BUILD_PARALLEL_LEVEL"
      # TODO: Check whether `compute-flow build native` can replace the direct CMake
      # commands used to configure and build generated brick tests.
      - name: Configure generated brick tests
        run: |
          uv run cmake -S . -B "$COMPUTE_FLOW_CI_BUILD_DIR" \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release
      # TODO: Check whether these prebuilt dependency assertions can be removed.
      - name: Require prebuilt dependencies
        if: matrix.from_source == 'OFF'
        run: |
          cache="$COMPUTE_FLOW_CI_BUILD_DIR/CMakeCache.txt"
          grep -qx 'COMPUTE_FLOW_USE_PREBUILT_DEPS:BOOL=ON' "$cache"
          for dependency in PROTOBUF LITERT EXECUTORCH ONNXRUNTIME MNN SENTENCEPIECE; do
            grep -qx "COMPUTE_FLOW_BUILD_${dependency}_FROM_SOURCE:BOOL=OFF" "$cache"
          done
      - name: Build generated brick tests
        if: matrix.from_source == 'OFF'
        run: uv run cmake --build "$COMPUTE_FLOW_CI_BUILD_DIR" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Run generated brick tests
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/$COMPUTE_FLOW_CI_BUILD_DIR/python${PYTHONPATH:+:$PYTHONPATH}"
          # TODO: Discover installed bricks with generated tests automatically.
          bricks=(
            vad:silero-vad
            audio_detection:perch
            audio_tool_calling:neu-decide
            audio_to_audio:ulunas
            stt:moonshine
            audio_detection:nemotron3-diarization
            stt:parakeet-tdt
            stt:nemotron-asr
            lm_text:lm-text-generic
            monocular_depth_estimation:depth-anything-v3
            monocular_depth_estimation:zip-depth
            object_detection:yolo
            tts:qwen3-tts
            # TODO: Enable FLUX once its tests match the public model package;
            # flux2_klein_generation_4step_manifest.json is currently missing.
            # image_generation:flux2-klein-generation
            tts:pocket-tts
          )
          for brick in "${bricks[@]}"; do
            brick_path="$(uv run compute-flow brick path "$brick")"
            echo "::group::Test $brick"
            COMPUTE_FLOW_HOME="$COMPUTE_FLOW_TEST_MODEL_HOME" \
              uv run bash "$brick_path/test/run_tests.sh"
            echo "::endgroup::"
          done
      - name: Clean up the short model path
        if: always()
        run: |
          if [ -L "$COMPUTE_FLOW_TEST_MODEL_HOME" ]; then
            unlink "$COMPUTE_FLOW_TEST_MODEL_HOME"
          fi

  cmake-build-android:
    name: Android™ ARM64 from source (CMake)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_NDK_VERSION: "27.3.13750724"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      COMPUTE_FLOW_HOME: ${{ github.workspace }}/.compute-flow
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # TODO: Test a user-provided NDK via COMPUTE_FLOW_ANDROID_NDK_ROOT.
      - name: Select Android™ NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -f "$ndk/build/cmake/android.toolchain.cmake" ]; then
            sdkmanager "ndk;$ANDROID_NDK_VERSION"
          fi
          echo "NDK=$ndk" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: uv sync --locked --no-default-groups --group build --group bricks --group tests
      - name: Install bricks
        run: |
          uv run compute-flow update
          uv run compute-flow brick install --all
          uv run compute-flow brick list
      # TODO: Check whether `compute-flow build android_arm64 --from-source` can
      # replace the direct CMake configuration and build commands.
      - name: Configure with CMake
        run: |
          uv run cmake -S . -B build_android_arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build_android_arm64/install" \
            -DCOMPUTE_FLOW_USE_PREBUILT_DEPS=OFF \
            -DCOMPUTE_FLOW_BUILD_PROTOBUF_FROM_SOURCE=ON \
            -DCOMPUTE_FLOW_BUILD_LITERT_FROM_SOURCE=ON \
            -DCOMPUTE_FLOW_BUILD_EXECUTORCH_FROM_SOURCE=ON \
            -DCOMPUTE_FLOW_BUILD_ONNXRUNTIME_FROM_SOURCE=ON \
            -DCOMPUTE_FLOW_BUILD_MNN_FROM_SOURCE=ON \
            -DCOMPUTE_FLOW_BUILD_SENTENCEPIECE_FROM_SOURCE=ON
      - name: Build with CMake
        run: uv run cmake --build build_android_arm64 --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Package SDK and install
        run: |
          uv run cmake --build build_android_arm64 --target compute_flow_application_sdk --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          uv run cmake --install build_android_arm64
      - name: Collect CLI binaries
        run: |
          mkdir -p artifacts
          find build_android_arm64 -type f -name '*_cli' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*_cli' -print -quit)"
