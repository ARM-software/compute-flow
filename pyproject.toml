[project]
name = "compute_flow"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.7.1",
    "pip>=26.0.1",
    "pyyaml==6.0.3",
    "rich>=14.3.3",
]

[project.scripts]
compute-flow = "brick_manager.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "brick_manager.build_backend"
backend-path = ["compute_flow/python"]

[dependency-groups]
build = [
    "cmake>=3.24",
    "torch==2.14.0",  # torch is required by ExecuTorch
]
bricks = [
    "numpy==2.4.3",
    "soundfile==0.13.1",
    "sounddevice==0.5.5",
    "Pillow==12.1.1",
]
# TODO: Remove brick_scripts with the placeholder scripts in final production release
brick-scripts = [
    "onnx==1.20.1",
    "requests==2.32.5",
    "transformers==5.3.0",
    "ai-edge-torch==0.7.2",
    "einops==0.8.2",
    "ultralytics==8.4.23",
]
formatters = [
    "clang-format==22.1.2",
    "gersemi==0.26.1",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.0.10",
    "ruff==0.15.7",
    "pre-commit==4.6.2",
]

[tool.uv]
default-groups = ["build", "bricks", "formatters"]
reinstall-package = ["compute-flow"]
# ExecuTorch 1.5.0 requires torch 2.14, while the LiteRT conversion tools require an older torch.
conflicts = [
    [
        { group = "build" },
        { group = "brick-scripts" },
    ],
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
package-dir = {"" = "compute_flow/python"}

[tool.setuptools.packages.find]
where = ["compute_flow/python"]

[tool.setuptools.package-data]
brick_manager = ["completion/*.sh", "templates/*.in"]
